<!doctype html><html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Reset password — NavoFlo</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/auth.css?v=8.10"></head><body class="auth-page"><header class="site-header"><div class="container nav-wrap"><a class="brand" href="/en/"><span class="brand-mark"><span></span><span></span><span></span></span><span>NavoFlo</span></a><div class="lang-switcher"><a data-reset-lang href="/reset-password/">FR</a><a class="active" data-reset-lang href="/en/reset-password/">EN</a></div></div></header><main class="auth-shell"><section class="auth-card" data-auth-reset><span class="eyebrow-text">NAVOFLO ACCOUNT</span><h1>New password</h1><p>Choose a new NavoFlo password. The link can only be used once.</p><div data-auth-message></div><form class="auth-form" data-reset-form hidden><label>New password<input type="password" name="password" autocomplete="new-password" minlength="12" required></label><label>Confirm<input type="password" name="confirm" autocomplete="new-password" minlength="12" required></label><small class="auth-password-note">Minimum 12 characters. A passphrase is recommended.</small><button type="submit">Change password</button></form><div class="auth-links"><a href="/en/login/">Back to sign in</a></div></section></main><script>for(const a of document.querySelectorAll('[data-reset-lang]')){const t=new URLSearchParams(location.search).get('token');if(t)a.href+=('?token='+encodeURIComponent(t));}</script><script src="/js/auth.js?v=8.10" defer></script></body></html>
