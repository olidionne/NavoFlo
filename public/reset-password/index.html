<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Réinitialiser le mot de passe — NavoFlo</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/auth.css?v=8.10"></head><body class="auth-page"><header class="site-header"><div class="container nav-wrap"><a class="brand" href="/"><span class="brand-mark"><span></span><span></span><span></span></span><span>NavoFlo</span></a><div class="lang-switcher"><a class="active" data-reset-lang href="/reset-password/">FR</a><a data-reset-lang href="/en/reset-password/">EN</a></div></div></header><main class="auth-shell"><section class="auth-card" data-auth-reset><span class="eyebrow-text">COMPTE NAVOFLO</span><h1>Nouveau mot de passe</h1><p>Choisissez un nouveau mot de passe NavoFlo. Le lien ne peut être utilisé qu’une seule fois.</p><div data-auth-message></div><form class="auth-form" data-reset-form hidden><label>Nouveau mot de passe<input type="password" name="password" autocomplete="new-password" minlength="12" required></label><label>Confirmer<input type="password" name="confirm" autocomplete="new-password" minlength="12" required></label><small class="auth-password-note">Minimum 12 caractères. Une phrase de passe est recommandée.</small><button type="submit">Modifier le mot de passe</button></form><div class="auth-links"><a href="/login/">Retour à la connexion</a></div></section></main><script>for(const a of document.querySelectorAll('[data-reset-lang]')){const t=new URLSearchParams(location.search).get('token');if(t)a.href+=('?token='+encodeURIComponent(t));}</script><script src="/js/auth.js?v=8.10" defer></script></body></html>
